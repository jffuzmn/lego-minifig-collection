<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minifig Collection</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Minifigs" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --yellow: #FFED00;
      --red: #E3000B;
      --black: #000000;
      --white: #FFFFFF;
      --bg: #F2F2F2;
      --card-bg: #FFFFFF;
      --border: #000000;
      --border-light: #D8D8D8;
      --text: #000000;
      --text-muted: #555555;
      --collected-green: #00B242;
      --font: 'Cera Pro', 'Nunito', system-ui, Arial, sans-serif;
      --radius: 8px;
      --shadow: 0 2px 0 rgba(0,0,0,1);
      --shadow-hover: 0 4px 0 rgba(0,0,0,1);
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      background: var(--red);
      padding: 0 32px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: stretch;
      min-height: 64px;
    }

    .header-brand {
      display: flex;
      align-items: center;
      padding-right: 32px;
      border-right: 2px solid rgba(0,0,0,0.2);
    }

    .header-logo { height: 52px; width: auto; display: block; }

    .header-stats {
      display: none;
    }

    .stat-label {
      color: var(--white);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 700;
    }

    .stat-value {
      color: var(--white);
      font-size: 1.3rem;
      font-weight: 900;
      line-height: 1;
    }

    .stat-value span { color: var(--white); }

    .header-progress {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
    }

    .progress-bar {
      width: 160px;
      height: 8px;
      background: rgba(255,255,255,0.3);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--white);
      border-radius: 4px;
      transition: width 0.4s ease;
    }

    .header-controls {
      margin-left: auto;
      display: flex;
      align-items: center;
      padding-left: 32px;
    }

    input[type="search"] {
      background: rgba(0,0,0,0.2);
      border: 2px solid rgba(0,0,0,0.3);
      color: var(--white);
      padding: 7px 12px;
      border-radius: var(--radius);
      font-size: 0.8rem;
      font-family: var(--font);
      font-weight: 700;
      outline: none;
      cursor: text;
      width: 200px;
      transition: border-color 0.15s;
    }

    input[type="search"]::placeholder { color: rgba(255,255,255,0.5); }
    input[type="search"]:focus { border-color: rgba(0,0,0,0.6); }

    /* ── FILTER BAR ── */
    .filter-bar {
      background: var(--white);
      border-bottom: 2px solid var(--black);
      padding: 10px 32px;
      display: flex;
      gap: 8px;
      flex-wrap: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
      position: sticky;
      top: 64px;
      z-index: 90;
    }

    .filter-bar::-webkit-scrollbar { display: none; }

    .filter-pill {
      padding: 5px 14px;
      border-radius: 20px;
      border: 2px solid var(--black);
      background: transparent;
      color: var(--black);
      font-family: var(--font);
      font-size: 0.72rem;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.12s, color 0.12s;
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .filter-pill:hover { background: var(--black); color: var(--white); }

    .filter-pill.active {
      background: var(--yellow);
      border-color: var(--black);
      color: var(--black);
      box-shadow: var(--shadow);
    }

    /* ── MAIN ── */
    main { padding: 32px; }

    /* ── CATEGORY GROUP ── */
    .category-group-header {
      font-size: 0.65rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      padding: 32px 0 8px;
      border-bottom: 2px solid var(--border-light);
    }

    .category-group.first-visible .category-group-header { padding-top: 0; }

    .category-stats {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0 20px;
    }

    .category-stats-text {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .category-stats-bar {
      width: 120px;
      height: 5px;
      background: var(--border-light);
      border-radius: 3px;
      overflow: hidden;
    }

    .category-stats-fill {
      height: 100%;
      background: var(--collected-green);
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    /* ── OVERALL STATS ── */
    .overall-stats {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 32px;
      background: var(--bg);
      border-bottom: 2px solid var(--border-light);
    }

    .overall-stats-label {
      font-size: 0.7rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
    }

    .overall-stats-text {
      font-size: 0.85rem;
      font-weight: 900;
      color: var(--text);
    }

    .overall-stats-bar {
      width: 160px;
      height: 6px;
      background: var(--border-light);
      border-radius: 3px;
      overflow: hidden;
    }

    .overall-stats-fill {
      height: 100%;
      background: var(--collected-green);
      border-radius: 3px;
      transition: width 0.4s ease;
    }

    .overall-stats-pct {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--text-muted);
    }

    /* ── SERIES SECTION ── */
    .series-section { margin-bottom: 48px; }

    .series-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding: 12px 20px;
      background: var(--yellow);
      border-radius: var(--radius);
      border: 2px solid var(--black);
      box-shadow: var(--shadow);
    }

    .series-title {
      font-size: 1rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--black);
    }

    .series-item-num {
      font-size: 0.72rem;
      font-weight: 700;
      color: #333;
      background: rgba(0,0,0,0.12);
      padding: 2px 7px;
      border-radius: 4px;
      letter-spacing: 0.04em;
    }

    .series-progress {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .series-progress-text {
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--black);
      white-space: nowrap;
    }

    .series-progress-bar {
      width: 80px;
      height: 6px;
      background: rgba(0,0,0,0.15);
      border-radius: 3px;
      overflow: hidden;
    }

    .series-progress-fill {
      height: 100%;
      background: var(--black);
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    /* ── GRID ── */
    .figs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 14px;
    }

    /* ── CARD ── */
    .fig-card {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      position: relative;
      user-select: none;
      box-shadow: var(--shadow);
    }

    .fig-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); }
    .fig-card:active { transform: translateY(0); box-shadow: var(--shadow); }

    .fig-card.collected {
      border-color: var(--collected-green);
      box-shadow: 0 2px 0 var(--collected-green);
      background: #f0faf4;
    }

    .fig-card.collected:hover { box-shadow: 0 4px 0 var(--collected-green); }

    /* ── IMAGE ── */
    .fig-img-wrap {
      width: 100%;
      aspect-ratio: 1;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .fig-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .fig-img-wrap .no-img { font-size: 2.5rem; opacity: 0.2; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }

    /* ── COLLECTED BADGE ── */
    .collected-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 24px;
      height: 24px;
      background: var(--collected-green);
      border: 2px solid var(--white);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.6);
      transition: opacity 0.15s, transform 0.15s;
    }

    .collected-badge svg { width: 13px; height: 13px; fill: var(--white); }
    .fig-card.collected .collected-badge { opacity: 1; transform: scale(1); }

    .fig-card:not(.collected) .fig-img-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.45);
      pointer-events: none;
    }

    /* ── CARD LABEL ── */
    .fig-info { padding: 8px 10px; border-top: 2px solid var(--border-light); }

    .fig-card.collected .fig-info {
      border-top-color: var(--collected-green);
      background: #f0faf4;
    }

    .fig-name {
      font-size: 0.7rem;
      font-weight: 800;
      line-height: 1.3;
      color: var(--text);
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .fig-card.collected .fig-name { color: var(--collected-green); }

    /* ── UTILITY ── */
    .fig-card.hidden { display: none; }
    .series-section.hidden { display: none; }
    .category-group.hidden { display: none; }
  </style>
</head>
<body>

<header>
  <div class="header-brand">
    <img src="lego-logo.png" alt="LEGO Minifig Collection" class="header-logo" />
  </div>
  <div class="header-stats">
    <div>
      <div class="stat-label">Collected</div>
      <div class="stat-value"><span id="header-stat-collected">0</span> / <span id="header-stat-total">0</span></div>
    </div>
    <div class="header-progress">
      <div class="stat-label" id="header-stat-pct">0%</div>
      <div class="progress-bar"><div class="progress-fill" id="header-global-progress" style="width:0%"></div></div>
    </div>
  </div>
  <div class="header-controls">
    <input type="search" id="search" placeholder="Search minifigs…" />
  </div>
</header>

<div id="filter-bar" class="filter-bar"></div>


<main id="main"></main>

<script>
(async () => {
  const res = await fetch('data.json');
  const data = await res.json();

  // Categories where images live flat (no series subfolder)
  const FLAT_IMG_CATS = new Set(['BAM', 'Spongebob', 'Spiderman']);

  // BAM slugs that collide across multiple figs — use itemNum suffix to disambiguate
  const bamSlugCounts = {};
  for (const fig of data) {
    if (fig.categories.includes('BAM')) {
      const slug = fig.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      bamSlugCounts[slug] = (bamSlugCounts[slug] || 0) + 1;
    }
  }
  const BAM_DUPE_SLUGS = new Set(Object.keys(bamSlugCounts).filter(s => bamSlugCounts[s] > 1));

  function imgSrc(fig) {
    const cat  = fig.categories[0].toLowerCase();
    const name = fig.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    if (fig.categories[0] === 'BAM' && BAM_DUPE_SLUGS.has(name)) {
      return `images/${cat}/${name}-${fig.itemNum}.webp`;
    }
    return FLAT_IMG_CATS.has(fig.categories[0])
      ? `images/${cat}/${name}.webp`
      : `images/${cat}/${fig.series.toLowerCase()}/${name}.webp`;
  }

  const CATEGORY_ORDER = [
    'Collectible Minifigs', 'Disney', 'BAM',
    'Animal Crossing', 'Toy Story', 'Spongebob',
    'Spiderman', 'F1 Cars', 'Space Classic', 'Brick Body'
  ];

  // Only show categories that have data, in defined order
  const allCats = new Set();
  for (const fig of data) for (const cat of fig.categories) allCats.add(cat);
  const categories = CATEGORY_ORDER.filter(c => allCats.has(c));
  for (const c of allCats) if (!categories.includes(c)) categories.push(c);

  // Build seriesMap: key = "category:series", fig appears in each of its categories
  // Brick Body collapses all series into a single "Color" group
  const seriesMap = new Map();
  for (const fig of data) {
    for (const cat of fig.categories) {
      const key = cat === 'Brick Body' ? `${cat}:Color` : `${cat}:${fig.series}`;
      if (!seriesMap.has(key)) seriesMap.set(key, []);
      seriesMap.get(key).push(fig);
    }
  }

  const seriesOrder = [...seriesMap.keys()].sort((a, b) => {
    const catA = a.slice(0, a.indexOf(':')), serA = a.slice(a.indexOf(':') + 1);
    const catB = b.slice(0, b.indexOf(':')), serB = b.slice(b.indexOf(':') + 1);
    const catDiff = categories.indexOf(catA) - categories.indexOf(catB);
    if (catDiff !== 0) return catDiff;
    const mA = serA.match(/^Series (\d+)$/);
    const mB = serB.match(/^Series (\d+)$/);
    if (mA && mB) return parseInt(mA[1]) - parseInt(mB[1]);
    if (mA) return -1;
    if (mB) return 1;
    if (catA === 'BAM') return serB.localeCompare(serA);
    return serA.localeCompare(serB);
  });

  // figToCards: for toggling all instances of a fig across categories
  const figToCards = new WeakMap();
  // sectionCards: for search filtering within a section
  const sectionCards = new Map();

  const main = document.getElementById('main');
  const sections = new Map();
  const categoryGroupEls = new Map();

  for (const cat of categories) {
    const catKeys = seriesOrder.filter(k => k.slice(0, k.indexOf(':')) === cat);
    if (!catKeys.length) continue;

    const catGroup = document.createElement('div');
    catGroup.className = 'category-group';
    catGroup.dataset.category = cat;

    const catHeader = document.createElement('div');
    catHeader.className = 'category-group-header';
    catHeader.textContent = cat;
    catGroup.appendChild(catHeader);

    const catStats = document.createElement('div');
    catStats.className = 'category-stats';
    catStats.innerHTML = `
      <span class="category-stats-text" data-cat-stat="${cat}">0 / 0 collected</span>
      <div class="category-stats-bar"><div class="category-stats-fill" data-cat-bar="${cat}" style="width:0%"></div></div>
    `;
    catGroup.appendChild(catStats);

    for (const key of catKeys) {
      const figs = seriesMap.get(key);
      const seriesName = key.slice(key.indexOf(':') + 1);
      const itemNum = figs[0].itemNum;

      const section = document.createElement('div');
      section.className = 'series-section';
      section.dataset.series = key;
      section.innerHTML = `
        <div class="series-header">
          <span class="series-title">${seriesName}</span>
          ${seriesName !== 'Color' ? `<span class="series-item-num">#${itemNum}</span>` : ''}
          <div class="series-progress">
            <span class="series-progress-text" data-series-prog="${key}">0/${figs.length}</span>
            <div class="series-progress-bar">
              <div class="series-progress-fill" data-series-bar="${key}" style="width:0%"></div>
            </div>
          </div>
        </div>
      `;

      const grid = document.createElement('div');
      grid.className = 'figs-grid';
      sectionCards.set(key, []);

      for (const fig of figs) {
        if (!figToCards.has(fig)) figToCards.set(fig, []);

        const card = document.createElement('div');
        card.className = 'fig-card' + (fig.collected ? ' collected' : '');
        card.dataset.name = fig.name.toLowerCase();
        card.dataset.collected = fig.collected ? '1' : '0';

        const fallbackSrc = fig.img && fig.img !== 'string' ? fig.img : null;
        const onerror = fallbackSrc
          ? `this.onerror=null;this.src='${fallbackSrc}'`
          : `this.onerror=null;this.style.display='none'`;
        card.innerHTML = `
          <div class="fig-img-wrap">
            <img src="${imgSrc(fig)}" alt="${fig.name}" loading="lazy" onerror="${onerror}" />
            <div class="collected-badge">
              <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
            </div>
          </div>
          <div class="fig-info"><div class="fig-name">${fig.name}</div></div>
        `;

        card.addEventListener('click', () => {
          fig.collected = !fig.collected;
          for (const c of figToCards.get(fig)) {
            c.dataset.collected = fig.collected ? '1' : '0';
            c.classList.toggle('collected', fig.collected);
          }
          saveState();
          updateStats();
        });

        figToCards.get(fig).push(card);
        sectionCards.get(key).push({ fig, card });
        grid.appendChild(card);
      }

      section.appendChild(grid);
      catGroup.appendChild(section);
      sections.set(key, section);
    }

    main.appendChild(catGroup);
    categoryGroupEls.set(cat, catGroup);
  }

  // ── STATE ──
  // Key is category-independent so multi-category figs share one state entry
  function stateKey(fig) { return `${fig.series}:${fig.name}`; }

  function loadState() {
    try {
      // Migrate v2 (category:series:name) → v3 (series:name)
      const v2raw = localStorage.getItem('minifig-collection-v2');
      if (v2raw) {
        const v2 = JSON.parse(v2raw);
        const migrated = {};
        for (const [k, v] of Object.entries(v2)) {
          migrated[k.slice(k.indexOf(':') + 1)] = v;
        }
        localStorage.setItem('minifig-collection-v3', JSON.stringify(migrated));
        localStorage.removeItem('minifig-collection-v2');
      }

      const saved = JSON.parse(localStorage.getItem('minifig-collection-v3') || '{}');
      for (const fig of data) {
        const sk = stateKey(fig);
        if (saved[sk] !== undefined) {
          fig.collected = saved[sk];
          for (const c of (figToCards.get(fig) || [])) {
            c.dataset.collected = fig.collected ? '1' : '0';
            c.classList.toggle('collected', fig.collected);
          }
        }
      }
    } catch (e) {}
  }

  function saveState() {
    const state = {};
    for (const fig of data) state[stateKey(fig)] = fig.collected;
    localStorage.setItem('minifig-collection-v3', JSON.stringify(state));
  }

  // ── STATS — count each unique fig once ──
  function updateStats() {
    const total = data.length;
    const collected = data.filter(f => f.collected).length;

    for (const [key, figs] of seriesMap) {
      const sc = figs.filter(f => f.collected).length;
      const pct = figs.length ? (sc / figs.length * 100).toFixed(0) : 0;
      const progEl = document.querySelector(`[data-series-prog="${key}"]`);
      const barEl = document.querySelector(`[data-series-bar="${key}"]`);
      if (progEl) progEl.textContent = `${sc}/${figs.length}`;
      if (barEl) barEl.style.width = `${pct}%`;
    }

    // Per-category totals (count unique figs per category)
    for (const cat of categories) {
      const catFigs = data.filter(f => f.categories.includes(cat));
      const catCollected = catFigs.filter(f => f.collected).length;
      const catTotal = catFigs.length;
      const catPct = catTotal ? (catCollected / catTotal * 100).toFixed(0) : 0;
      const statEl = document.querySelector(`[data-cat-stat="${cat}"]`);
      const barEl = document.querySelector(`[data-cat-bar="${cat}"]`);
      if (statEl) statEl.textContent = `${catCollected} / ${catTotal} collected`;
      if (barEl) barEl.style.width = `${catPct}%`;
    }

    const collectedEl = document.getElementById('header-stat-collected');
    const totalEl = document.getElementById('header-stat-total');
    const pctEl = document.getElementById('header-stat-pct');
    const progressEl = document.getElementById('header-global-progress');
    const pct = total ? (collected / total * 100).toFixed(1) : 0;
    if (collectedEl) collectedEl.textContent = collected;
    if (totalEl) totalEl.textContent = total;
    if (pctEl) pctEl.textContent = pct + '%';
    if (progressEl) progressEl.style.width = pct + '%';
  }

  // ── FILTER BAR ──
  const filterBar = document.getElementById('filter-bar');
  let activeCategory = 'all';

  function hashToCategory() {
    const h = decodeURIComponent(location.hash.slice(1)).toLowerCase();
    return categories.find(c => c.toLowerCase() === h) || 'all';
  }

  function setCategory(cat) {
    activeCategory = cat;
    location.hash = cat === 'all' ? '' : encodeURIComponent(cat);
    filterBar.querySelectorAll('.filter-pill').forEach(p =>
      p.classList.toggle('active', p.dataset.category === cat)
    );
    applyFilters();
  }

  [['all', 'All'], ...categories.map(c => [c, c])].forEach(([val, label]) => {
    const pill = document.createElement('button');
    pill.className = 'filter-pill';
    pill.textContent = label;
    pill.dataset.category = val;
    filterBar.appendChild(pill);
  });

  filterBar.addEventListener('click', e => {
    const pill = e.target.closest('.filter-pill');
    if (!pill) return;
    setCategory(pill.dataset.category);
  });

  window.addEventListener('hashchange', () => setCategory(hashToCategory()));

  document.getElementById('search').addEventListener('input', applyFilters);

  function applyFilters() {
    const q = document.getElementById('search').value.toLowerCase().trim();

    let firstVisible = true;
    for (const [cat, groupEl] of categoryGroupEls) {
      const hide = activeCategory !== 'all' && activeCategory !== cat;
      groupEl.classList.toggle('hidden', hide);
      groupEl.classList.toggle('first-visible', !hide && firstVisible);
      if (!hide) firstVisible = false;
    }

    for (const [key, pairs] of sectionCards) {
      const section = sections.get(key);
      let visible = 0;
      for (const { fig, card } of pairs) {
        const show = !q || fig.name.toLowerCase().includes(q);
        card.classList.toggle('hidden', !show);
        if (show) visible++;
      }
      section.classList.toggle('hidden', visible === 0);
    }
  }

  loadState();
  updateStats();
  setCategory(hashToCategory());
})();
</script>
</body>
</html>
